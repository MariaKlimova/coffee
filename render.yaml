databases:
  - name: coffee-db
    plan: free
    databaseName: coffee
    user: coffee

services:
  - type: web
    plan: free
    name: coffee-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://coffee-shop-ashy-two.vercel.app,http://localhost:5174
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_RETURN_URL
        value: https://coffee-shop-ashy-two.vercel.app/checkout/result
