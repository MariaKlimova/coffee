openapi: 3.0.3
info:
  title: Coffee Shop API
  version: 0.1.0
  description: |
    Черновой контракт API интернет-магазина кофе и кофемашин (Epic 0).
    Файл — стартовая точка для параллельной разработки backend/frontend.
    После реализации эндпоинтов источником истины станет схема из
    **drf-spectacular** (`GET /api/schema/`), а этот YAML обновляется по мере расхождений.

    ## Конвенции

    ### Пагинация
    List-эндпоинты используют query-параметры **`page`** (с 1) и **`page_size`** (по умолчанию 20, max 100).
    Ответ обёрнут в объект:

    ```json
    {
      "count": 42,
      "next": "https://api.example/...?page=3",
      "previous": "https://api.example/...?page=1",
      "results": []
    }
    ```

    ### Ошибки
    Единый формат тела ошибки:

    ```json
    {
      "detail": "Human-readable message",
      "code": "machine_readable_code"
    }
    ```

    Для ошибок валидации полей допускается расширение:

    ```json
    {
      "detail": "Invalid input",
      "code": "validation_error",
      "errors": { "email": ["Enter a valid email."] }
    }
    ```

    ### Цены
    Денежные суммы — **строка** с десятичным числом (например `"1299.00"`), валюта всегда **RUB**.
    Отдельного поля валюты в MVP нет (мультивалютность не поддерживается).

    ### Дата и время
    Все даты/время — **ISO 8601** в UTC, например `2026-07-25T12:00:00Z`.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Favorites
  - name: Cart
  - name: Orders
  - name: Payments

paths:
  /api/health/:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/auth/register/:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; tokens returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/login/:
    post:
      tags: [Auth]
      summary: Login and obtain tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh/:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
                  description: Refresh JWT
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout/:
    post:
      tags: [Auth]
      summary: Logout (invalidate refresh token)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getMe
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/categories/:
    get:
      tags: [Catalog]
      summary: List product categories
      operationId: listCategories
      security: []
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /api/products/:
    get:
      tags: [Catalog]
      summary: List products with filters
      operationId: listProducts
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category
          in: query
          schema:
            type: string
            enum: [coffee, machines]
          description: High-level category slug
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search
        - name: min_price
          in: query
          schema:
            type: string
            example: "100.00"
          description: Minimum price (RUB decimal string)
        - name: max_price
          in: query
          schema:
            type: string
            example: "5000.00"
          description: Maximum price (RUB decimal string)
        - name: ordering
          in: query
          schema:
            type: string
            enum: [price, -price, created_at, -created_at]
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductListItem"

  /api/products/{id}/:
    get:
      tags: [Catalog]
      summary: Product detail
      operationId: getProduct
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/favorites/:
    get:
      tags: [Favorites]
      summary: List favorite products
      operationId: listFavorites
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated favorites
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Favorites]
      summary: Add product to favorites
      operationId: addFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/favorites/{product_id}/:
    delete:
      tags: [Favorites]
      summary: Remove product from favorites
      operationId: removeFavorite
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cart/:
    get:
      tags: [Cart]
      summary: Get current cart
      operationId: getCart
      responses:
        "200":
          description: Cart with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cart/items/:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreate"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cart/items/{id}/:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: deleteCartItem
      parameters:
        - $ref: "#/components/parameters/CartItemId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders/:
    get:
      tags: [Orders]
      summary: List current user orders
      operationId: listOrders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      summary: Create order from current cart
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orders/{id}/:
    get:
      tags: [Orders]
      summary: Order detail
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payments/create/:
    post:
      tags: [Payments]
      summary: Create payment session for an order
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/payments/webhook/:
    post:
      tags: [Payments]
      summary: Payment provider webhook
      operationId: paymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload (draft)
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Items per page
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [detail, code]
      properties:
        detail:
          type: string
          description: Human-readable message
        code:
          type: string
          description: Machine-readable error code
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Optional field-level validation errors

    Money:
      type: string
      description: Decimal amount in RUB as string
      example: "1299.00"
      pattern: '^\d+(\.\d{1,2})?$'

    PaginatedResponse:
      type: object
      required: [count, next, previous, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items: {}

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthTokens:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string

    Category:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          enum: [coffee, machines]
        name:
          type: string

    ProductListItem:
      type: object
      required: [id, name, slug, price, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        category:
          type: string
          enum: [coffee, machines]
        image_url:
          type: string
          format: uri
          nullable: true

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductListItem"
        - type: object
          properties:
            description:
              type: string
            in_stock:
              type: boolean
            attributes:
              type: object
              additionalProperties: true
              description: Category-specific attributes (roast, grind, wattage, etc.)
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    Favorite:
      type: object
      required: [product_id, created_at]
      properties:
        product_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CartItemCreate:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CartItem:
      type: object
      required: [id, product, quantity, line_total]
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/ProductListItem"
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: "#/components/schemas/Money"

    Cart:
      type: object
      required: [id, items, total]
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          $ref: "#/components/schemas/Money"
        updated_at:
          type: string
          format: date-time

    OrderCreate:
      type: object
      required: [shipping_address]
      properties:
        shipping_address:
          type: object
          required: [city, street, postal_code]
          properties:
            city:
              type: string
            street:
              type: string
            postal_code:
              type: string
            comment:
              type: string

    OrderListItem:
      type: object
      required: [id, status, total, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, paid, processing, shipped, completed, cancelled]
        total:
          $ref: "#/components/schemas/Money"
        created_at:
          type: string
          format: date-time

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderListItem"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CartItem"
            shipping_address:
              type: object
              additionalProperties: true
            updated_at:
              type: string
              format: date-time

    PaymentSession:
      type: object
      required: [id, order_id, status, amount, payment_url]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, succeeded, failed]
        amount:
          $ref: "#/components/schemas/Money"
        payment_url:
          type: string
          format: uri
          description: Redirect URL to payment provider
        created_at:
          type: string
          format: date-time

security:
  - bearerAuth: []
