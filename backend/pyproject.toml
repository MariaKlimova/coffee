[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.vercel]
entrypoint = "config.vercel_wsgi:application"

[tool.vercel.scripts]
build = "python manage.py check --settings=config.settings.vercel --deploy --fail-level ERROR"
