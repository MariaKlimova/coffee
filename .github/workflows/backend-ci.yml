name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: lint-format-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: coffee
          POSTGRES_DB: coffee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee -d coffee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://coffee:coffee@localhost:5432/coffee
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend skeleton
        id: skeleton
        working-directory: .
        run: |
          if [ -f backend/requirements/dev.txt ] && [ -f backend/manage.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backend skeleton not ready yet (COFFEE-4). Skipping lint/tests."
          fi

      - name: Set up Python
        if: steps.skeleton.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        if: steps.skeleton.outputs.ready == 'true'
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        if: steps.skeleton.outputs.ready == 'true'
        run: ruff check .

      - name: Format check (black)
        if: steps.skeleton.outputs.ready == 'true'
        run: black --check .

      - name: Tests (pytest)
        if: steps.skeleton.outputs.ready == 'true'
        run: pytest
