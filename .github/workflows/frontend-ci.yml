name: frontend-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend skeleton
        id: skeleton
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frontend skeleton not ready yet (COFFEE-5). Skipping lint/typecheck/tests."
          fi

      - name: Set up Node
        if: steps.skeleton.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.skeleton.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.skeleton.outputs.ready == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.skeleton.outputs.ready == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.skeleton.outputs.ready == 'true'
        run: npm test

      - name: Build
        if: steps.skeleton.outputs.ready == 'true'
        run: npm run build
